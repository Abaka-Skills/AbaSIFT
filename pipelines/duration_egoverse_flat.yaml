# Demo 1 — duration probe over the egoverse flat delivery (iPhone/Core Media footage).
#
# Header-only probe: VideoDurationKernel decodes `video_meta`, which reads the container
# header over ranged GETs. ~0.5 MB per file regardless of file size, so this covers a
# 15.7 GB delivery for a few megabytes of transfer.
#
# Credentials come from the standard AWS chain (env / ~/.aws/credentials) — never here.
#   abasift run pipelines/duration_egoverse_flat.yaml -o /tmp/duration_report.json
pipeline:
  job_id: egoverse_flat_duration
  nodes:
    - name: load
      kernel: abasift.loaders.FlatDirLoader
      params:
        root: s3://egocentric-data-delivery/1_test_20260730
        batch_size: 4
      inputs: []

    - name: duration
      kernel: abasift.kernels.VideoDurationKernel
      params:
        min_s: 1.0          # anything under a second is not a usable take
        max_s: 1800.0       # 30 min: longer means the vendor never split the recording
      inputs: [load]

    - name: archive_report
      kernel: abasift.kernels.DataArchiver
      params:
        keys: ["__report__", "__pipeline__"]   # per-sample verdicts, plus the job and its config
        # No `target:` — defaults to ./dump/<job_id>_<hash>/<unix ts>/<node>/, with the
        # config copied to ./dump/<job_id>_<hash>/pipeline.yaml. Set one explicitly (used
        # verbatim, no timestamp) when a job must be retried to exactly the same paths.
      inputs: [duration]
